<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Salida Masiva
</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{

    background:#f4f6f9;

    padding:30px;

}

.contenedor{

    max-width:1100px;

    margin:auto;

    background:white;

    padding:30px;

    border-radius:20px;

    box-shadow:
    0 5px 15px
    rgba(0,0,0,.10);

}

h1{

    color:#102b57;

    margin-bottom:10px;

}

.subtitulo{

    color:#666;

    margin-bottom:25px;

}

.form-grid{

    display:grid;

    grid-template-columns:
    repeat(
        auto-fit,
        minmax(250px,1fr)
    );

    gap:15px;

    margin-bottom:20px;

}

label{

    display:block;

    margin-bottom:5px;

    font-weight:bold;

    color:#102b57;

}

input,
textarea{

    width:100%;

    padding:12px;

    border:1px solid #ddd;

    border-radius:10px;

    font-size:14px;

}

textarea{

    resize:none;

}

.boton{

    background:#102b57;

    color:white;

    border:none;

    border-radius:10px;

    padding:14px;

    cursor:pointer;

    font-weight:bold;

}

.boton:hover{

    background:#183f80;

}

.area-seriales{

    height:250px;

}

.campo-error{

    border:2px solid red;
}

.home{

    display:flex;

    justify-content:flex-end;

    margin-bottom:15px;

}

.home a{

    text-decoration:none;

    font-size:34px;

}

.modal{

    display:none;

    position:fixed;

    top:0;
    left:0;

    width:100%;
    height:100%;

    background:
    rgba(0,0,0,.5);

    justify-content:center;
    align-items:center;

}

.modal-content{

    background:white;

    padding:30px;

    border-radius:20px;

    text-align:center;

}

</style>
    
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
</head>

<body>

<div class="home">

<a
href="dashboard.html">

🏠

</a>

</div>

<div class="contenedor">

<h1>

📦 Salida Masiva

</h1>

<div class="subtitulo">

Despacho de múltiples seriales bajo una misma factura

</div>

<div class="form-grid">

<div>

<label>
Factura *
</label>

<input
type="text"
id="factura">

</div>

<div>

<label>
Cliente *
</label>

<input
type="text"
id="cliente">

</div>

</div>

<br>

<label>
Seriales *
</label>

<textarea
id="seriales"
class="area-seriales"
placeholder="Un serial por línea"></textarea>

<br>

<div class="form-grid">

<div>

<label>
Salida generada por *
</label>

<input
type="text"
id="usuario">

</div>

</div>

<label>
Observación
</label>

<textarea
id="observacion"
rows="3"></textarea>

<br><br>

<div class="form-grid">

<div>

<label>
Foto 1 *
</label>

<input
type="file"
id="foto1"
accept="image/*">

</div>

<div>

<label>
Foto 2
</label>

<input
type="file"
id="foto2"
accept="image/*">

</div>

</div>

<button
id="btnSalidaMasiva"
class="boton">

Procesar Salida Masiva

</button>

</div>

<div
id="modalExito"
class="modal">

<div
class="modal-content">

<h2>

✅ Salida registrada

</h2>

<br>

<button
class="boton"
onclick="location.reload()">

Aceptar

</button>

</div>

</div>
  <script>

const API =
"https://script.google.com/macros/s/AKfycbxhYkPMbOQJHrcSoxhFjOoo5zhspyW-yqdLVOsNmvhwQ7U-pxfgEjGAfqaAhP3Apa_qyw/exec";

let inventario = [];

let imagenBase64 = "";
let imagenBase642 = "";

cargarInventario();

async function cargarInventario(){

    try{

        const response =
        await fetch(API);

        inventario =
        await response.json();

    }
    catch(error){

        alert(
        "Error cargando inventario."
        );

    }

}

document
.getElementById(
"foto1"
)
.addEventListener(
"change",
mostrarPreview1
);

document
.getElementById(
"foto2"
)
.addEventListener(
"change",
mostrarPreview2
);

function mostrarPreview1(event){

    const archivo =
    event.target.files[0];

    if(!archivo) return;

    const reader =
    new FileReader();

    reader.onload =
    function(e){

        imagenBase64 =
        e.target.result;

    };

    reader.readAsDataURL(
        archivo
    );

}

function mostrarPreview2(event){

    const archivo =
    event.target.files[0];

    if(!archivo) return;

    const reader =
    new FileReader();

    reader.onload =
    function(e){

        imagenBase642 =
        e.target.result;

    };

    reader.readAsDataURL(
        archivo
    );

}

document
.getElementById(
"btnSalidaMasiva"
)
.addEventListener(
"click",
registrarSalidaMasiva
);

async function registrarSalidaMasiva(){

    const factura =
    document
    .getElementById(
    "factura"
    );

    const cliente =
    document
    .getElementById(
    "cliente"
    );

    const usuario =
    document
    .getElementById(
    "usuario"
    );

    const observacion =
    document
    .getElementById(
    "observacion"
    );

    const serialesTexto =
    document
    .getElementById(
    "seriales"
    );

    let seriales =
    serialesTexto.value
    .split("\n")
    .map(
    x => x.trim()
    )
    .filter(
    x => x !== ""
    );

    if(
        factura.value.trim() === ""
    ){

        alert(
        "Ingrese la factura."
        );

        return;
    }

    if(
        cliente.value.trim() === ""
    ){

        alert(
        "Ingrese el cliente."
        );

        return;
    }

    if(
        usuario.value.trim() === ""
    ){

        alert(
        "Ingrese el responsable."
        );

        return;
    }

    if(
        seriales.length === 0
    ){

        alert(
        "Ingrese seriales."
        );

        return;
    }

    if(
        !imagenBase64
    ){

        alert(
        "Debe adjuntar la Foto 1."
        );

        return;
    }

    // VALIDACIÓN TOTAL

    for(
        let s of seriales
    ){

        const existe =
        inventario.find(

        item =>

        String(item.serial)
        .trim()
        .toUpperCase()

        ===

        String(s)
        .trim()
        .toUpperCase()

        );

        if(!existe){

            alert(
            "Serial no encontrado: " +
            s
            );

            return;
        }

        if(
            String(existe.estado)
            .toUpperCase()
            !==
            "DISPONIBLE"
        ){

            alert(
            "Serial no disponible: " +
            s
            );

            return;
        }

    }

    const datos = {

        accion:
        "SALIDA_MASIVA",

        factura:
        factura.value,

        cliente:
        cliente.value,

        usuario:
        usuario.value,

        observacion:
        observacion.value,

        seriales:
        seriales

    };

    try{

        const response =
        await fetch(
        API,
        {
            method:"POST",
            body:
            JSON.stringify(
            datos
            )
        });

        const resultado =
        await response.json();

        console.log(resultado);

        if(
            !resultado.success
        ){

            alert(
            resultado.mensaje
            );

            return;
        }

        await generarPDFMasivo(
    resultado.consecutivo,        
    seriales,
    factura.value,
    cliente.value,
    usuario.value,
    observacion.value
);

        document
        .getElementById(
        "modalExito"
        )
        .style.display =
        "flex";

    }
    catch(error){

        console.error(
        error
        );

        alert(
        "Error registrando salida."
        );

    }

}
async function generarPDFMasivo(
    seriales,
    factura,
    cliente,
    usuario,
    observacion
){

    const { jsPDF } =
    window.jspdf;

    const pdf =
    new jsPDF();

    const fecha =
    new Date();

    const fechaActual =
    fecha.toLocaleDateString(
        "es-CO"
    );

    const equipos =
    inventario.filter(item =>

        seriales.includes(
            String(item.serial)
        )

    );

    const logo =
    new Image();

    logo.src =
    "LOGO IMC.png";

    logo.onload = function(){

// =====================================================
// ENCABEZADO
// =====================================================

pdf.addImage(
    logo,
    "PNG",
    12,
    8,
    26,
    26
);

pdf.setFillColor(
    15,
    42,
    84
);

pdf.rect(
    42,
    8,
    155,
    26,
    "F"
);

pdf.setTextColor(
    255,
    255,
    255
);

pdf.setFont(
    "helvetica",
    "bold"
);

pdf.setFontSize(18);

pdf.text(
    "FORMATO DE SALIDA DE ALMACÉN",
    120,
    18,
    {align:"center"}
);

pdf.setFontSize(10);

pdf.setFont(
    "helvetica",
    "normal"
);

pdf.text(
    "IMC Cargo International SAS",
    120,
    25,
    {align:"center"}
);

pdf.text(
    "Multilogística Integral",
    120,
    30,
    {align:"center"}
);

pdf.setTextColor(
    0,
    0,
    0
);

pdf.line(
    10,
    40,
    200,
    40
);

// =====================================================
// INFORMACIÓN GENERAL
// =====================================================

pdf.setFillColor(
    15,
    42,
    84
);

pdf.rect(
    10,
    46,
    190,
    10,
    "F"
);

pdf.setTextColor(
    255,
    255,
    255
);

pdf.setFont(
    "helvetica",
    "bold"
);

pdf.setFontSize(13);

pdf.text(
    "INFORMACIÓN GENERAL",
    15,
    53
);

pdf.setTextColor(
    0,
    0,
    0
);

// TARJETA

pdf.setDrawColor(
    180,
    180,
    180
);

pdf.rect(
    10,
    56,
    190,
    58
);

pdf.setFontSize(11);

// CONSECUTIVO

pdf.setFont(
    "helvetica",
    "bold"
);

pdf.text(
    "Consecutivo:",
    15,
    66
);

pdf.setFont(
    "helvetica",
    "normal"
);

pdf.text(
    consecutivo,
    55,
    66
);

// FACTURA

pdf.setFont(
    "helvetica",
    "bold"
);

pdf.text(
    "Factura:",
    15,
    78
);

pdf.setFont(
    "helvetica",
    "normal"
);

pdf.text(
    factura,
    55,
    78
);

// CLIENTE

pdf.setFont(
    "helvetica",
    "bold"
);

pdf.text(
    "Cliente:",
    15,
    90
);

pdf.setFont(
    "helvetica",
    "normal"
);

pdf.text(
    cliente,
    55,
    90
);

// USUARIO

pdf.setFont(
    "helvetica",
    "bold"
);

pdf.text(
    "Salida Generada Por:",
    15,
    102
);

pdf.setFont(
    "helvetica",
    "normal"
);

pdf.text(
    usuario,
    65,
    102
);

// FECHA

pdf.setFont(
    "helvetica",
    "bold"
);

pdf.text(
    "Fecha:",
    120,
    66
);

pdf.setFont(
    "helvetica",
    "normal"
);

pdf.text(
    fechaActual,
    145,
    66
);

// CANTIDAD

pdf.setFont(
    "helvetica",
    "bold"
);

pdf.text(
    "Cantidad Equipos:",
    120,
    78
);

pdf.setFont(
    "helvetica",
    "normal"
);

pdf.text(
    String(equipos.length),
    165,
    78
);

// POSICIÓN INICIAL DE LA TABLA

 y = 128;

        // TABLA

   pdf.setFillColor(
    15,
    42,
    84
);

pdf.rect(
    10,
    115,
    190,
    10,
    "F"
);

pdf.setTextColor(
    255,
    255,
    255
);

pdf.setFont(
    "helvetica",
    "bold"
);

pdf.text(
    "EQUIPOS DESPACHADOS",
    15,
    122
);

pdf.setTextColor(
    0,
    0,
    0
);
         y = 128;

        pdf.setFontSize(10);

        pdf.setFont(
            "helvetica",
            "bold"
        );

        pdf.text(
            "Material",
            15,
            y
        );

y = 135;

// CABECERA TABLA

pdf.setFillColor(
    230,
    235,
    245
);

pdf.rect(
    10,
    y - 6,
    190,
    8,
    "F"
);

pdf.rect(
    10,
    y - 6,
    40,
    8
);

pdf.rect(
    50,
    y - 6,
    100,
    8
);

pdf.rect(
    150,
    y - 6,
    50,
    8
);

pdf.setFont(
    "helvetica",
    "bold"
);

pdf.text(
    "Material",
    15,
    y
);

pdf.text(
    "Descripción",
    55,
    y
);

pdf.text(
    "Serial",
    160,
    y
);

y += 10;

        pdf.line(
            10,
            y - 4,
            200,
            y - 4
        );

        pdf.setFont(
            "helvetica",
            "normal"
        );

        equipos.forEach(item => {

            if(y > 250){

                pdf.addPage();

                y = 20;

            }

            pdf.text(
                String(item.material),
                15,
                y
            );

            pdf.text(
                String(item.descripcion)
                .substring(0,50),
                60,
                y
            );

            pdf.text(
                String(item.serial),
                165,
                y
            );

            y += 8;

        });

        // OBSERVACIÓN

        y += 10;

        pdf.setFont(
            "helvetica",
            "bold"
        );

        pdf.text(
            "Observación",
            15,
            y
        );

        y += 8;

        pdf.setFont(
            "helvetica",
            "normal"
        );

        pdf.text(
            observacion || "-",
            15,
            y
        );

        y += 15;

        // FOTO 1

        if(imagenBase64){

            pdf.setDrawColor(
                0,
                0,
                0
            );

            pdf.rect(
                15,
                y,
                80,
                60
            );

            pdf.addImage(
                imagenBase64,
                "JPEG",
                17,
                y + 2,
                76,
                56
            );

        }

        // FOTO 2

        if(imagenBase642){

            pdf.rect(
                110,
                y,
                80,
                60
            );

            pdf.addImage(
                imagenBase642,
                "JPEG",
                112,
                y + 2,
                76,
                56
            );

        }

        // PIE

        pdf.setFontSize(8);

        pdf.text(
            "Documento generado automáticamente",
            15,
            285
        );

        pdf.text(
            "Sistema de Control de Inventario",
            15,
            290
        );

        pdf.text(
            "IMC Cargo International SAS",
            15,
            295
        );

        pdf.save(
            "SALIDA_" +
            factura +
            ".pdf"
        );

    };

}
</script>

</body>
</html>
