<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Salida Masiva
</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{

    background:#f4f6f9;

    padding:30px;

}

.contenedor{

    max-width:1100px;

    margin:auto;

    background:white;

    padding:30px;

    border-radius:20px;

    box-shadow:
    0 5px 15px
    rgba(0,0,0,.10);

}

h1{

    color:#102b57;

    margin-bottom:10px;

}

.subtitulo{

    color:#666;

    margin-bottom:25px;

}

.form-grid{

    display:grid;

    grid-template-columns:
    repeat(
        auto-fit,
        minmax(250px,1fr)
    );

    gap:15px;

    margin-bottom:20px;

}

label{

    display:block;

    margin-bottom:5px;

    font-weight:bold;

    color:#102b57;

}

input,
textarea{

    width:100%;

    padding:12px;

    border:1px solid #ddd;

    border-radius:10px;

    font-size:14px;

}

textarea{

    resize:none;

}

.boton{

    background:#102b57;

    color:white;

    border:none;

    border-radius:10px;

    padding:14px;

    cursor:pointer;

    font-weight:bold;

}

.boton:hover{

    background:#183f80;

}

.area-seriales{

    height:250px;

}

.campo-error{

    border:2px solid red;
}

.home{

    display:flex;

    justify-content:flex-end;

    margin-bottom:15px;

}

.home a{

    text-decoration:none;

    font-size:34px;

}

.modal{

    display:none;

    position:fixed;

    top:0;
    left:0;

    width:100%;
    height:100%;

    background:
    rgba(0,0,0,.5);

    justify-content:center;
    align-items:center;

}

.modal-content{

    background:white;

    padding:30px;

    border-radius:20px;

    text-align:center;

}

</style>
    
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
</head>

<body>

<div class="home">

<a
href="dashboard.html">

🏠

</a>

</div>

<div class="contenedor">

<h1>

📦 Salida Masiva

</h1>

<div class="subtitulo">

Despacho de múltiples seriales bajo una misma factura

</div>

<div class="form-grid">

<div>

<label>
Factura *
</label>

<input
type="text"
id="factura">

</div>

<div>

<label>
Cliente *
</label>

<input
type="text"
id="cliente">

</div>

</div>

<br>

<label>
Seriales *
</label>

<textarea
id="seriales"
class="area-seriales"
placeholder="Un serial por línea"></textarea>

<br>

<div class="form-grid">

<div>

<label>
Salida generada por *
</label>

<input
type="text"
id="usuario">

</div>

</div>

<label>
Observación
</label>

<textarea
id="observacion"
rows="3"></textarea>

<br><br>

<div class="form-grid">

<div>

<label>
Foto 1 *
</label>

<input
type="file"
id="foto1"
accept="image/*">

</div>

<div>

<label>
Foto 2
</label>

<input
type="file"
id="foto2"
accept="image/*">

</div>

</div>

<button
id="btnSalidaMasiva"
class="boton">

Procesar Salida Masiva

</button>

</div>

<div
id="modalExito"
class="modal">

<div
class="modal-content">

<h2>

✅ Salida registrada

</h2>

<br>

<button
class="boton"
onclick="location.reload()">

Aceptar

</button>

</div>

</div>
  <script>

const API =
"https://script.google.com/macros/s/AKfycbxhYkPMbOQJHrcSoxhFjOoo5zhspyW-yqdLVOsNmvhwQ7U-pxfgEjGAfqaAhP3Apa_qyw/exec";

let inventario = [];

let imagenBase64 = "";
let imagenBase642 = "";

cargarInventario();

async function cargarInventario(){

    try{

        const response =
        await fetch(API);

        inventario =
        await response.json();

    }
    catch(error){

        alert(
        "Error cargando inventario."
        );

    }

}

document
.getElementById(
"foto1"
)
.addEventListener(
"change",
mostrarPreview1
);

document
.getElementById(
"foto2"
)
.addEventListener(
"change",
mostrarPreview2
);

function mostrarPreview1(event){

    const archivo =
    event.target.files[0];

    if(!archivo) return;

    const reader =
    new FileReader();

    reader.onload =
    function(e){

        imagenBase64 =
        e.target.result;

    };

    reader.readAsDataURL(
        archivo
    );

}

function mostrarPreview2(event){

    const archivo =
    event.target.files[0];

    if(!archivo) return;

    const reader =
    new FileReader();

    reader.onload =
    function(e){

        imagenBase642 =
        e.target.result;

    };

    reader.readAsDataURL(
        archivo
    );

}

document
.getElementById(
"btnSalidaMasiva"
)
.addEventListener(
"click",
registrarSalidaMasiva
);

async function registrarSalidaMasiva(){

    const factura =
    document
    .getElementById(
    "factura"
    );

    const cliente =
    document
    .getElementById(
    "cliente"
    );

    const usuario =
    document
    .getElementById(
    "usuario"
    );

    const observacion =
    document
    .getElementById(
    "observacion"
    );

    const serialesTexto =
    document
    .getElementById(
    "seriales"
    );

    let seriales =
    serialesTexto.value
    .split("\n")
    .map(
    x => x.trim()
    )
    .filter(
    x => x !== ""
    );

    if(
        factura.value.trim() === ""
    ){

        alert(
        "Ingrese la factura."
        );

        return;
    }

    if(
        cliente.value.trim() === ""
    ){

        alert(
        "Ingrese el cliente."
        );

        return;
    }

    if(
        usuario.value.trim() === ""
    ){

        alert(
        "Ingrese el responsable."
        );

        return;
    }

    if(
        seriales.length === 0
    ){

        alert(
        "Ingrese seriales."
        );

        return;
    }

    if(
        !imagenBase64
    ){

        alert(
        "Debe adjuntar la Foto 1."
        );

        return;
    }

    // VALIDACIÓN TOTAL

    for(
        let s of seriales
    ){

        const existe =
        inventario.find(

        item =>

        String(item.serial)
        .trim()
        .toUpperCase()

        ===

        String(s)
        .trim()
        .toUpperCase()

        );

        if(!existe){

            alert(
            "Serial no encontrado: " +
            s
            );

            return;
        }

        if(
            String(existe.estado)
            .toUpperCase()
            !==
            "DISPONIBLE"
        ){

            alert(
            "Serial no disponible: " +
            s
            );

            return;
        }

    }

    const datos = {

        accion:
        "SALIDA_MASIVA",

        factura:
        factura.value,

        cliente:
        cliente.value,

        usuario:
        usuario.value,

        observacion:
        observacion.value,

        seriales:
        seriales

    };

    try{

        const response =
        await fetch(
        API,
        {
            method:"POST",
            body:
            JSON.stringify(
            datos
            )
        });

        const resultado =
        await response.json();

        console.log(resultado);

        if(
            !resultado.success
        ){

            alert(
            resultado.mensaje
            );

            return;
        }

        await generarPDFMasivo(
    resultado.consecutivo,        
    seriales,
    factura.value,
    cliente.value,
    usuario.value,
    observacion.value
);

        document
        .getElementById(
        "modalExito"
        )
        .style.display =
        "flex";

    }
    catch(error){

        console.error(
        error
        );

    alert(
        "ERROR: " +
        error.message
    );

    }

}
async function generarPDFMasivo(
    consecutivo,
    seriales,
    factura,
    cliente,
    usuario,
    observacion
){

    const { jsPDF } =
    window.jspdf;

    const pdf =
    new jsPDF();

    const fecha =
    new Date();

    const fechaActual =
    fecha.toLocaleDateString(
        "es-CO"
    );

    const equipos =
    inventario.filter(item =>

        seriales.includes(
            String(item.serial)
        )

    );

    const logo =
    new Image();

    logo.src =
    "LOGO IMC.png";

    logo.onload = function(){

 // ==================================
        // LOGO
        // ==================================

        pdf.addImage(
            logo,
            "PNG",
            10,
            8,
            22,
            22
        );

        // ==================================
        // TITULO
        // ==================================

        pdf.setFont(
            "helvetica",
            "bold"
        );

        pdf.setFontSize(16);

        pdf.text(
            "FORMATO DE SALIDA DE ALMACÉN",
            105,
            18,
            {align:"center"}
        );

        pdf.setFontSize(10);

        pdf.setFont(
            "helvetica",
            "normal"
        );

        pdf.text(
            "IMC Cargo International SAS",
            105,
            25,
            {align:"center"}
        );

        pdf.line(
            10,
            35,
            200,
            35
        );

        // ==================================
        // CONSECUTIVO
        // ==================================

        pdf.setDrawColor(
            0,
            0,
            0
        );

        pdf.rect(
            10,
            40,
            190,
            12
        );

        pdf.setFont(
            "helvetica",
            "bold"
        );

        pdf.text(
            "CONSECUTIVO:",
            15,
            48
        );

        pdf.setFont(
            "helvetica",
            "normal"
        );

        pdf.text(
            consecutivo,
            55,
            48
        );

// =====================================================
// INFORMACIÓN DE DESPACHO
// =====================================================

pdf.setFillColor(
    15,
    42,
    84
);

pdf.rect(
    10,
    53,
    190,
    8,
    "F"
);

pdf.setTextColor(
    255,
    255,
    255
);

pdf.setFont(
    "helvetica",
    "bold"
);

pdf.text(
    "INFORMACIÓN DE DESPACHO",
    105,
    58,
    {align:"center"}
);

pdf.setTextColor(
    0,
    0,
    0
);

// SOLO BORDE EXTERNO

pdf.rect(
    10,
    61,
    190,
    16
);

// FILA SUPERIOR

pdf.setFont(
    "helvetica",
    "bold"
);

pdf.text(
    "Fecha:",
    15,
    65
);

pdf.text(
    "Factura:",
    72,
    65
);
pdf.text(
    "Cliente:",
    121,
    65
);
        
pdf.setFont(
    "helvetica",
    "normal"
);

pdf.text(
    fechaActual,
    28,
    65
);

pdf.text(
    factura,
    83,
    65
);
pdf.text(
    cliente,
    135,
    65
);

// FILA INFERIOR

pdf.setFont(
    "helvetica",
    "bold"
);

pdf.text(
    "Cantidad Equipos:",
    15,
    72
);

pdf.text(
    "Generado por:",
    72,
    72
);

pdf.setFont(
    "helvetica",
    "normal"
);

pdf.text(
    String(equipos.length),
    47,
    72
);

pdf.text(
    usuario,
    97,
    72
);

let y = 85;

// ========================================
// DETALLE DE EQUIPOS DESPACHADOS
// ========================================

pdf.setFillColor(15, 42, 84);
pdf.rect(10, y, 190, 8, "F");

pdf.setTextColor(255, 255, 255);
pdf.setFont("helvetica", "bold");
pdf.setFontSize(10);

pdf.text(
    "DETALLE DE EQUIPOS DESPACHADOS",
    105,
    y + 5,
    { align: "center" }
);

y += 10;

// CABECERA

pdf.setFillColor(230, 235, 245);

pdf.rect(10, y, 20, 8, "FD");   // ITEM
pdf.rect(30, y, 45, 8, "FD");   // MATERIAL
pdf.rect(75, y, 65, 8, "FD");   // REFERENCIA
pdf.rect(140, y, 25, 8, "FD");  // SERIAL
pdf.rect(165, y, 35, 8, "FD");  // ESTADO

pdf.setTextColor(0, 0, 0);
pdf.setFont("helvetica", "bold");
pdf.setFontSize(8);

pdf.text("ITEM", 20, y + 5, { align: "center" });
pdf.text("SERIAL", 52, y + 5, { align: "center" });
pdf.text("REFERENCIA", 107, y + 5, { align: "center" });
pdf.text("MARCA", 152, y + 5, { align: "center" });
pdf.text("ESTADO", 182, y + 5, { align: "center" });

y += 8;

pdf.setFont("helvetica", "normal");
pdf.setFontSize(8);

equipos.forEach((equipo, index) => {

    pdf.rect(10, y, 20, 7);
    pdf.rect(30, y, 45, 7);
    pdf.rect(75, y, 65, 7);
    pdf.rect(140, y, 25, 7);
    pdf.rect(165, y, 35, 7);

    pdf.text(
        String(index + 1),
        20,
        y + 5,
        { align: "center" }
    );

    pdf.text(
        String(equipo.serial || ""),
        52,
        y + 5,
        { align: "center" }
    );

    pdf.text(
        String(equipo.referencia || ""),
        107,
        y + 5,
        { align: "center" }
    );

    pdf.text(
        String(equipo.marca || ""),
        152,
        y + 5,
        { align: "center" }
    );

    pdf.text(
        "DESPACHADO",
        182,
        y + 5,
        { align: "center" }
    );

    y += 7;
});
        
// =====================================================
// OBSERVACIONES
// =====================================================

y += 10;

pdf.setFont(
    "helvetica",
    "bold"
);

pdf.text(
    "OBSERVACIONES",
    10,
    y
);

y += 5;

pdf.rect(
    10,
    y,
    190,
    18
);

pdf.setFont(
    "helvetica",
    "normal"
);

pdf.text(
    observacion || "NINGUNA",
    15,
    y + 10
);

y += 30;

// =====================================================
// REGISTRO FOTOGRÁFICO
// =====================================================

pdf.setFillColor(
    15,
    42,
    84
);

pdf.rect(
    10,
    y,
    190,
    8,
    "F"
);

pdf.setTextColor(
    255,
    255,
    255
);

pdf.text(
    "REGISTRO FOTOGRÁFICO",
    105,
    y + 5,
    {align:"center"}
);

pdf.setTextColor(
    0,
    0,
    0
);

y += 8;
// FOTO 1

pdf.rect(
    10,
    y,
    90,
    35
);

if(imagenBase64){

    pdf.addImage(
        imagenBase64,
        "JPEG",
        12,
        y + 2,
        86,
        31
    );

}

// FOTO 2

pdf.rect(
    110,
    y,
    90,
    35
);

if(imagenBase642){

    pdf.addImage(
        imagenBase642,
        "JPEG",
        112,
        y + 2,
        86,
        31
    );

}

y += 60;

// =====================================================
// FIRMAS
// =====================================================

pdf.line(
    20,
    y,
    80,
    y
);

pdf.line(
    120,
    y,
    180,
    y
);

pdf.setFont(
    "helvetica",
    "bold"
);

pdf.text(
    "ENTREGA",
    35,
    y + 8
);

pdf.text(
    "Nombre:",
    30,
    y + 15
);

pdf.text(
    "RECIBE",
    140,
    y + 8
);

pdf.text(
    "Nombre:",
    135,
    y + 15
);

// =====================================================
// PIE
// =====================================================

pdf.line(
    10,
    272,
    200,
    272
);

pdf.setFont(
    "helvetica",
    "normal"
);

pdf.setFontSize(9);

pdf.text(
    "Documento generado automáticamente",
    105,
    275,
    {align:"center"}
);

pdf.text(
    "Sistema de Control de Inventario",
    105,
    280,
    {align:"center"}
);

pdf.text(
    "IMC Cargo International SAS",
    105,
    285,
    {align:"center"}
);
        

pdf.save(
    consecutivo +
    ".pdf"
        );

    };

}
</script>

</body>
</html>
