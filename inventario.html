<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Inventario General</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:#f4f6f9;
    padding:40px;
}

.topbar{
    display:flex;
    justify-content:flex-end;
    margin-bottom:20px;
}

.home-btn{
    text-decoration:none;
    font-size:36px;
    transition:.3s;
}

.home-btn:hover{
    transform:scale(1.15);
}

.titulo{
    color:#102b57;
    font-size:42px;
    font-weight:700;
    margin-bottom:8px;
}

.subtitulo{
    color:#666;
    margin-bottom:30px;
    font-size:18px;
}

.buscador{
    background:white;
    padding:25px;
    border-radius:20px;
    margin-bottom:25px;
    box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.buscador input{
    width:100%;
    padding:16px;
    border:1px solid #ddd;
    border-radius:12px;
    font-size:16px;
}

.contador{
    margin-top:15px;
    color:#666;
    font-weight:600;
}

.inventario{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(380px,1fr));
    gap:20px;
}

.card{
    background:white;
    padding:25px;
    border-radius:20px;
    box-shadow:0 5px 15px rgba(0,0,0,.08);
    border-left:8px solid #102b57;
}

.serial{
    color:#102b57;
    font-size:24px;
    font-weight:bold;
    margin-bottom:15px;
}

.info{
    margin-bottom:12px;
    line-height:1.5;
}

.label{
    color:#102b57;
    font-weight:bold;
}

.estado{
    display:inline-block;
    margin-top:10px;
    padding:8px 15px;
    background:#e8f5e9;
    color:#2e7d32;
    border-radius:20px;
    font-size:14px;
}

.vacio{
    background:white;
    padding:30px;
    border-radius:20px;
    text-align:center;
    color:#888;
}

</style>
</head>

<body>

<div class="topbar">

<a href="dashboard.html" class="home-btn">
🏠
</a>

</div>

<div class="titulo">
📋 INVENTARIO GENERAL
</div>

<div class="subtitulo">
Consulta completa del inventario conectado a Google Sheets
</div>

<div class="buscador">

<input
type="text"
id="buscar"
placeholder="Buscar por serial, material, marca o ubicación..."
onkeyup="filtrar()">

<div id="contador" class="contador">
Cargando inventario...
</div>

</div>

<div id="inventario" class="inventario">

<div class="vacio">
Cargando información...
</div>

</div>

<script>

let inventario = [];

fetch("https://script.google.com/macros/s/AKfycbxhYkPMbOQJHrcSoxhFjOoo5zhspyW-yqdLVOsNmvhwQ7U-pxfgEjGAfqaAhP3Apa_qyw/exec")

.then(function(response){
    return response.json();
})

.then(function(data){

    inventario = data;

    document.getElementById("contador").innerHTML =
    "Total registros: " + data.length;

    renderizar(data);

})

.catch(function(error){

    console.error(error);

    document.getElementById("contador").innerHTML =
    "Error cargando inventario";

});

function renderizar(datos){

    let html = "";

    datos.forEach(function(item){

        html += `

        <div class="card">

            <div class="serial">
                ${item.serial}
            </div>

            <div class="info">
                <span class="label">📦 Material:</span><br>
                ${item.material}
            </div>

            <div class="info">
                <span class="label">🏢 Marca:</span><br>
                ${item.marca}
            </div>

            <div class="info">
                <span class="label">📍 Ubicación:</span><br>
                ${item.ubicacion}
            </div>

            <div class="estado">
                Disponible
            </div>

        </div>

        `;

    });

    document.getElementById("inventario").innerHTML = html;

}

function filtrar(){

    let texto = document
        .getElementById("buscar")
        .value
        .toLowerCase();

    let resultado = inventario.filter(function(item){

        return String(item.serial).toLowerCase().includes(texto) ||

               String(item.material).toLowerCase().includes(texto) ||

               String(item.marca).toLowerCase().includes(texto) ||

               String(item.ubicacion).toLowerCase().includes(texto);

    });

    document.getElementById("contador").innerHTML =
    "Resultados encontrados: " + resultado.length;

    renderizar(resultado);

}

</script>

</body>
</html>
