<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Inventario General</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:#f4f6f9;
    padding:40px;
}

.topbar{
    display:flex;
    justify-content:flex-end;
    margin-bottom:20px;
}

.home-btn{
    text-decoration:none;
    font-size:36px;
    transition:.3s;
}

.home-btn:hover{
    transform:scale(1.15);
}

.titulo{
    color:#102b57;
    font-size:42px;
    font-weight:700;
    margin-bottom:8px;
}

.subtitulo{
    color:#666;
    margin-bottom:30px;
    font-size:18px;
}

.panel{
    background:white;
    padding:25px;
    border-radius:20px;
    box-shadow:0 5px 15px rgba(0,0,0,.08);
    margin-bottom:25px;
}

.panel input{
    width:100%;
    padding:15px;
    border:1px solid #ddd;
    border-radius:12px;
    font-size:16px;
}

.contador{
    margin-top:12px;
    color:#666;
    font-weight:600;
}

.tabla-contenedor{
    background:white;
    border-radius:20px;
    box-shadow:0 5px 15px rgba(0,0,0,.08);
    overflow:auto;
}

table{
    width:100%;
    border-collapse:collapse;
}

thead{
    background:#102b57;
    color:white;
}

th{
    padding:18px;
    text-align:left;
    font-size:15px;
}

td{
    padding:15px;
    border-bottom:1px solid #eee;
}

tr:hover{
    background:#f8f9fc;
}

.serial{
    font-weight:bold;
    color:#102b57;
}

.estado{
    background:#e8f5e9;
    color:#2e7d32;
    padding:5px 12px;
    border-radius:20px;
    font-size:13px;
    font-weight:bold;
}

</style>

</head>

<body>

<div class="topbar">

<a href="dashboard.html" class="home-btn">
🏠
</a>

</div>

<div class="titulo">
📋 INVENTARIO GENERAL
</div>

<div class="subtitulo">
Consulta completa del inventario conectado a Google Sheets
</div>

<div class="panel">

<input
type="text"
id="buscar"
placeholder="Buscar por serial, material, marca o ubicación..."
onkeyup="filtrar()">

<div id="contador" class="contador">
Cargando inventario...
</div>

</div>

<div class="tabla-contenedor">

<table>

<thead>

<tr>
<th>Serial</th>
<th>Material</th>
<th>Marca</th>
<th>Ubicación</th>
<th>Estado</th>
</tr>

</thead>

<tbody id="tablaInventario">

<tr>
<td colspan="5">
Cargando registros...
</td>
</tr>

</tbody>

</table>

</div>

<script>

let inventario = [];

fetch("https://script.google.com/macros/s/AKfycbxhYkPMbOQJHrcSoxhFjOoo5zhspyW-yqdLVOsNmvhwQ7U-pxfgEjGAfqaAhP3Apa_qyw/exec")

.then(function(response){
    return response.json();
})

.then(function(data){

    inventario = data;

    document.getElementById("contador").innerHTML =
    "Total registros: " + data.length;

    renderizar(data);

})

.catch(function(error){

    console.error(error);

    document.getElementById("contador").innerHTML =
    "Error cargando inventario";

});

function renderizar(datos){

    let filas = "";

    datos.forEach(function(item){

        filas += `

        <tr>

            <td class="serial">
                ${item.serial}
            </td>

            <td>
                ${item.material}
            </td>

            <td>
                ${item.marca}
            </td>

            <td>
                ${item.ubicacion}
            </td>

            <td>
                <span class="estado">
                    Disponible
                </span>
            </td>

        </tr>

        `;

    });

    document.getElementById("tablaInventario").innerHTML =
    filas;

}

function filtrar(){

    let texto =
    document.getElementById("buscar")
    .value
    .toLowerCase();

    let resultado = inventario.filter(function(item){

        return String(item.serial)
            .toLowerCase()
            .includes(texto)

            ||

            String(item.material)
            .toLowerCase()
            .includes(texto)

            ||

            String(item.marca)
            .toLowerCase()
            .includes(texto)

            ||

            String(item.ubicacion)
            .toLowerCase()
            .includes(texto);

    });

    document.getElementById("contador").innerHTML =
    "Resultados encontrados: " + resultado.length;

    renderizar(resultado);

}

</script>

</body>

</html>
