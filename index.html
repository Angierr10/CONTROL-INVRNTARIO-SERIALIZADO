<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CONTROL DE INVENTARIO OUTLET - GARANTÍAS</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#07152f,#183a7a);
}

.card{
    width:550px;
    height:550px;
    border-radius:50%;
    background:white;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    box-shadow:0 15px 40px rgba(0,0,0,0.35);
}

.badge{
    background:#102b57;
    color:#ffc107;
    padding:12px 30px;
    border-radius:40px;
    font-weight:bold;
    margin-bottom:30px;
    font-size:16px;
}

h1{
    color:#102b57;
    font-size:42px;
    margin-bottom:10px;
    line-height:1.2;
}

h2{
    color:#ffc107;
    font-size:24px;
    margin-bottom:20px;
}

p{
    color:#555;
    font-size:18px;
    margin-bottom:35px;
}

button{
    background:#102b57;
    color:white;
    border:none;
    padding:18px 40px;
    font-size:20px;
    border-radius:12px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#1d4b95;
    transform:scale(1.05);
}

</style>
</head>

<body>

<div class="card">

    <div class="badge">
        SISTEMA CORPORATIVO
    </div>

    <h1>
        CONTROL DE INVENTARIO
    </h1>

    <h2>
        OUTLET - GARANTÍAS
    </h2>

    <p>
        Plataforma de Control Serializado
    </p>

    <button>
        Entrar al Sistema
    </button>

</div>

</body>
</html>
