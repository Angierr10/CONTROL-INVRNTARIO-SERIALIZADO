<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CONTROL DE INVENTARIO OUTLET - GARANTÍAS</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#07152f,#183a7a);
}

.card{
width:520px;
height:520px;
background:white;
border-radius:50%;
border:8px solid #ffc107;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:40px;
box-shadow:0 20px 50px rgba(0,0,0,0.35);
}

.icono{
font-size:65px;
margin-bottom:15px;
}

.badge{
background:#102b57;
color:#ffc107;
padding:10px 25px;
border-radius:50px;
font-weight:bold;
margin-bottom:25px;
}

.titulo{
color:#102b57;
font-size:28px;
font-weight:700;
line-height:1.2;
margin-bottom:10px;
}

.subtitulo{
color:#f0a500;
font-size:22px;
font-weight:600;
margin-bottom:20px;
}

.descripcion{
color:#666;
font-size:16px;
margin-bottom:35px;
}

.btn{
background:linear-gradient(90deg,#ffb300,#ffd54f);
color:#102b57;
padding:16px 40px;
border:none;
border-radius:60px;
font-size:18px;
font-weight:bold;
cursor:pointer;
box-shadow:0 8px 20px rgba(255,193,7,0.4);
transition:0.3s;
}

.btn:hover{
transform:translateY(-3px);
}

</style>
</head>

<body>

<div class="card">

<div class="icono">📦</div>

<div class="badge">
SISTEMA CORPORATIVO
</div>

<div class="titulo">
CONTROL DE INVENTARIO
</div>

<div class="subtitulo">
OUTLET - GARANTÍAS
</div>

<div class="descripcion">
Plataforma de Gestión de Inventario Serializado
</div>

<button class="btn">
INGRESAR
</button>

</div>

</body>
</html>
