<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Control Inventario Serializado</title>

<style>

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:linear-gradient(135deg,#07152f,#183a7a);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.card{
    background:white;
width:500px;
height:500px;
border-radius:50%;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,0.3);
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,0.3);
}

.badge{
    background:#0f274d;
    color:#ffbe0b;
    display:inline-block;
    padding:10px 20px;
    border-radius:20px;
    font-weight:bold;
    margin-bottom:20px;
}

h1{
    color:#0f274d;
}

p{
    color:gray;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#0f274d;
    color:white;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#183a7a;
}

</style>
</head>

<body>

<div class="card">

<div class="badge">
CONTROL INVENTARIO OUTLET - GARANTIAS
</div>

<h1>Acceso al Sistema</h1>

<p>Inventario Serializado </p>

<button>Entrar al Sistema</button>

</div>

</body>
</html>
