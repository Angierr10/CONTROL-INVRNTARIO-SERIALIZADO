<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CONTROL DE INVENTARIO OUTLET - GARANTÍAS</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI, Arial, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#07152f,#183a7a);
}

.card{
    width:550px;
    height:550px;
    border-radius:50%;
    background:white;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding:40px;
    text-align:center;
    box-shadow:0 20px 40px rgba(0,0,0,0.35);
}

.icono{
    font-size:70px;
    margin-bottom:20px;
}

.badge{
    background:#0d2b5c;
    color:#ffc107;
    padding:12px 30px;
    border-radius:40px;
    font-weight:bold;
    margin-bottom:25px;
}

h1{
    color:#0d2b5c;
    font-size:34px;
    line-height:1.2;
}

h2{
    color:#ff9800;
    margin-top:10px;
    margin-bottom:20px;
    font-size:24px;
}

p{
    color:#666;
    margin-bottom:35px;
    font-size:17px;
}

.btn-ingresar{
    border:none;
    padding:18px 50px;
    border-radius:50px;
    background:linear-gradient(90deg,#ff9800,#ffc107);
    color:#0d2b5c;
    font-size:20px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
    box-shadow:0 8px 20px rgba(255,152,0,0.4);
}

.btn-ingresar:hover{
    transform:translateY(-3px);
    box-shadow:0 12px 25px rgba(255,152,0,0.5);
}

</style>
</head>

<body>

<div class="card">

    <div class="icono">📦</div>

    <div class="badge">
        SISTEMA CORPORATIVO
    </div>

    <h1>
        CONTROL DE INVENTARIO
    </h1>

    <h2>
        OUTLET - GARANTÍAS
    </h2>

    <p>
        Plataforma de Gestión y Control Serializado
    </p>

    <button class="btn-ingresar">
        Ingresar
    </button>

</div>

</body>
</html>
