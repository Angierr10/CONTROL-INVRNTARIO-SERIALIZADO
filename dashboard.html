<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard Inventario</title>

<style>

body{
    margin:0;
    font-family:Segoe UI,sans-serif;
    background:#07152f;
}

.header{
    background:#102b57;
    color:white;
    padding:20px;
    text-align:center;
    font-size:28px;
    font-weight:bold;
}

.container{
    padding:30px;
}

.cards{
    display:flex;
    flex-wrap:wrap;
    gap:20px;
}

.card{
    background:white;
    width:220px;
    padding:20px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 10px 20px rgba(0,0,0,0.2);
}

.numero{
    font-size:40px;
    font-weight:bold;
    color:#ffb300;
}

.label{
    color:#102b57;
    font-size:18px;
    margin-top:10px;
}

</style>

</head>

<body>

<div class="header">
📦 CONTROL DE INVENTARIO OUTLET - GARANTÍAS
</div>

<div class="container">

<div class="cards">

<div class="card">
<div class="numero">0</div>
<div class="label">Total Inventario</div>
</div>

<div class="card">
<div class="numero">0</div>
<div class="label">Disponibles</div>
</div>

<div class="card">
<div class="numero">0</div>
<div class="label">Salidas</div>
</div>

<div class="card">
<div class="numero">0</div>
<div class="label">Ubicaciones</div>
</div>

</div>

</div>

</body>
</html>
