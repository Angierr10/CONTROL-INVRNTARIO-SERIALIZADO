<script>

fetch("https://script.google.com/macros/s/AKfycbxhYkPMbOQJHrcSoxhFjOoo5zhspyW-yqdLVOsNmvhwQ7U-pxfgEjGAfqaAhP3Apa_qyw/exec")

.then(response => response.json())

.then(data => {

    document.getElementById("totalEquipos")
        .innerText = data.length;

    let marcas =
        [...new Set(data.map(x => x.marca))];

    document.getElementById("totalMarcas")
        .innerText = marcas.length;

    let ubicaciones =
        [...new Set(data.map(x => x.ubicacion))];

    document.getElementById("totalUbicaciones")
        .innerText = ubicaciones.length;

    let materiales =
        [...new Set(data.map(x => x.material))];

    document.getElementById("totalMateriales")
        .innerText = materiales.length;

})

.catch(error => {

    console.error(error);

});

</script>
