<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard Inventario</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    display:flex;
    background:#f4f6f9;
}

.sidebar{
    width:260px;
    height:100vh;
    background:#102b57;
    color:white;
    position:fixed;
    left:0;
    top:0;
}

.logo{
    padding:25px;
    text-align:center;
    border-bottom:1px solid rgba(255,255,255,0.1);
}

.logo h2{
    color:#ffc107;
}

.menu{
    padding-top:20px;
}

.menu a{
    display:block;
    padding:18px 25px;
    color:white;
    text-decoration:none;
    transition:0.3s;
}

.menu a:hover{
    background:#183f80;
    padding-left:35px;
}

.menu a.active{
    background:#ffc107;
    color:#102b57;
    font-weight:bold;
}

.main{
    margin-left:260px;
    width:100%;
    padding:30px;
}

.header{
    background:white;
    padding:20px;
    border-radius:15px;
    margin-bottom:30px;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
}

.header h1{
    color:#102b57;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
}

.card{
    background:white;
    padding:25px;
    border-radius:20px;
    box-shadow:0 8px 20px rgba(0,0,0,0.1);
}

.card .icon{
    font-size:35px;
}

.card .number{
    font-size:40px;
    font-weight:bold;
    color:#102b57;
    margin-top:10px;
}

.card .text{
    color:gray;
    margin-top:5px;
}

</style>
</head>

<body>

<div class="sidebar">

<div class="logo">
<h2>📦 INVENTARIO</h2>
<p>Outlet - Garantías</p>
</div>

<div class="menu">

<div class="main">

<div class="header">
<h1>CONTROL DE INVENTARIO OUTLET - GARANTÍAS</h1>
<p>Panel principal de gestión</p>
</div>

<div class="cards">

<div class="card">
<div class="icon">📦</div>
<div class="number">0</div>
<div class="text">Total Inventario</div>
</div>

<div class="card">
<div class="icon">✅</div>
<div class="number">0</div>
<div class="text">Disponibles</div>
</div>

<div class="card">
<div class="icon">📤</div>
<div class="number">0</div>
<div class="text">Salidas</div>
</div>

<div class="card">
<div class="icon">📍</div>
<div class="number">0</div>
<div class="text">Ubicaciones</div>
</div>

</div>

</body>
