<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Registro de Ingreso</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:#f4f6f9;
    padding:40px;
}

.topbar{
    display:flex;
    justify-content:flex-end;
    margin-bottom:20px;
}

.home-btn{
    text-decoration:none;
    font-size:36px;
}

.home-btn:hover{
    transform:scale(1.15);
}

.titulo{
    font-size:42px;
    font-weight:bold;
    color:#102b57;
    margin-bottom:10px;
}

.subtitulo{
    color:#666;
    margin-bottom:25px;
}

.formulario{
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 5px 15px rgba(0,0,0,.08);
    max-width:900px;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:8px;
    font-weight:bold;
    color:#102b57;
}

input,
textarea{
    width:100%;
    padding:14px;
    border:1px solid #ddd;
    border-radius:10px;
}

textarea{
    height:100px;
}

.campo-error{
    border:2px solid #dc3545 !important;
    background:#fff5f5;
}

.boton-guardar{
    margin-top:25px;
    padding:15px 30px;
    border:none;
    border-radius:12px;
    background:#102b57;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.boton-guardar:hover{
    background:#183f80;
}

.boton-guardar:disabled{
    background:#9aa5b1;
    cursor:not-allowed;
}

.modal{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.35);
    justify-content:center;
    align-items:center;
    z-index:9999;
}

.modal-content{
    background:white;
    padding:35px;
    border-radius:20px;
    text-align:center;
    min-width:350px;
    box-shadow:0 15px 35px rgba(0,0,0,.2);
}

.modal-content h2{
    margin-bottom:20px;
}

.modal-content button{
    background:#102b57;
    color:white;
    border:none;
    padding:12px 25px;
    border-radius:10px;
    font-weight:bold;
    cursor:pointer;
    margin:5px;
}

.btn-cancelar{
    background:#6c757d !important;
}

</style>

</head>

<body>

<div class="topbar">
<a href="dashboard.html" class="home-btn">🏠</a>
</div>

<div class="titulo">
📥 REGISTRO DE INGRESO
</div>

<div class="subtitulo">
Registrar ingreso de equipos al inventario
</div>

<div class="formulario">

<label>Material *</label>
<input id="material">

<label>Descripción *</label>
<input id="descripcion">

<label>Marca *</label>
<input id="marca">

<label>Serial *</label>
<input id="serial">

<label>Ubicación *</label>
<input id="ubicacion">

<label>Fecha de Ingreso *</label>
<input id="fecha" type="date">

<label>Documento de Ingreso</label>
<input id="documentoIngreso">

<label>Usuario *</label>
<input id="usuario">

<label>Observación</label>
<textarea id="observacion"></textarea>

<button
id="btnGuardar"
class="boton-guardar"
onclick="guardarIngreso()">
Registrar Ingreso
</button>

</div>

<!-- MODAL EXITO -->

<div id="modalExito" class="modal">

<div class="modal-content">

<h2 style="color:#198754;">
✅ Registro realizado correctamente
</h2>

<button onclick="cerrarModalExito()">
ACEPTAR
</button>

</div>

</div>

<!-- MODAL REINGRESO -->

<div id="modalReingreso" class="modal">

<div class="modal-content">

<h2 style="color:#ff9800;">
⚠️ Serial existente
</h2>

<p style="margin-bottom:20px;">
El serial ya existe en inventario.
<br><br>
¿Desea registrarlo como REINGRESO?
</p>

<button onclick="confirmarReingreso()">
CONFIRMAR
</button>

<button
class="btn-cancelar"
onclick="cancelarReingreso()">
CANCELAR
</button>

</div>

</div>

<!-- MODAL ERROR -->

<div id="modalError" class="modal">

<div class="modal-content">

<h2 style="color:#dc3545;">
❌ Error
</h2>

<p id="textoError"
style="margin-bottom:20px;">
</p>

<button onclick="cerrarModalError()">
ACEPTAR
</button>

</div>

</div>

<script>

const API =
"https://script.google.com/macros/s/AKfycbxhYkPMbOQJHrcSoxhFjOoo5zhspyW-yqdLVOsNmvhwQ7U-pxfgEjGAfqaAhP3Apa_qyw/exec";

function obtenerDatos(){

return {

material:
document.getElementById("material").value.trim(),

descripcion:
document.getElementById("descripcion").value.trim(),

marca:
document.getElementById("marca").value.trim(),

serial:
document.getElementById("serial").value.trim().toUpperCase(),

ubicacion:
document.getElementById("ubicacion").value.trim(),

fechaIngreso:
document.getElementById("fecha").value,

documentoIngreso:
document.getElementById("documentoIngreso").value.trim(),

usuario:
document.getElementById("usuario").value.trim(),

observacion:
document.getElementById("observacion").value.trim()

};

}

function guardarIngreso(){

const campos = [

document.getElementById("material"),
document.getElementById("descripcion"),
document.getElementById("marca"),
document.getElementById("serial"),
document.getElementById("ubicacion"),
document.getElementById("fecha"),
document.getElementById("usuario")

];

campos.forEach(campo=>{
campo.classList.remove("campo-error");
});

let primerError = null;

campos.forEach(campo=>{

if(campo.value.trim()===""){

campo.classList.add("campo-error");

if(!primerError){
primerError = campo;
}

}

});

if(primerError){

primerError.focus();

mostrarError(
"Debe completar todos los campos obligatorios."
);

return;

}

const boton =
document.getElementById("btnGuardar");

boton.disabled = true;
boton.innerHTML = "Guardando...";

fetch(API,{
method:"POST",
body:JSON.stringify(obtenerDatos())
})

.then(response=>response.json())

.then(data=>{

if(
data.success === false &&
data.tipo === "REINGRESO"
){

document
.getElementById("modalReingreso")
.style.display="flex";

boton.disabled = false;
boton.innerHTML =
"Registrar Ingreso";

return;

}

document
.getElementById("modalExito")
.style.display = "flex";

})

.catch(error=>{

console.error(error);

mostrarError(
"No fue posible registrar el ingreso."
);

boton.disabled = false;
boton.innerHTML =
"Registrar Ingreso";

});

}

function confirmarReingreso(){

const datos = obtenerDatos();

datos.confirmarReingreso = true;

fetch(API,{
method:"POST",
body:JSON.stringify(datos)
})

.then(response=>response.json())

.then(data=>{

document
.getElementById("modalReingreso")
.style.display="none";

document
.getElementById("modalExito")
.style.display="flex";

})

.catch(error=>{

console.error(error);

document
.getElementById("modalReingreso")
.style.display="none";

mostrarError(
"No fue posible registrar el reingreso."
);

});

}

function cancelarReingreso(){

document
.getElementById("modalReingreso")
.style.display="none";

}

function cerrarModalExito(){

document
.getElementById("modalExito")
.style.display="none";

[
"material",
"descripcion",
"marca",
"serial",
"ubicacion",
"fecha",
"documentoIngreso",
"usuario",
"observacion"
].forEach(id=>{

document.getElementById(id).value="";

});

document
.querySelectorAll(".campo-error")
.forEach(campo=>{

campo.classList.remove("campo-error");

});

const boton =
document.getElementById("btnGuardar");

boton.disabled = false;
boton.innerHTML =
"Registrar Ingreso";

}

function mostrarError(mensaje){

document
.getElementById("textoError")
.innerHTML = mensaje;

document
.getElementById("modalError")
.style.display="flex";

}

function cerrarModalError(){

document
.getElementById("modalError")
.style.display="none";

}

</script>

</body>

</html>
