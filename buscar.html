<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Buscar Serial</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:#f4f6f9;
    padding:40px;
}

.volver{
    display:inline-block;
    margin-bottom:25px;
    background:#102b57;
    color:white;
    text-decoration:none;
    padding:12px 22px;
    border-radius:30px;
    font-weight:600;
}

.volver:hover{
    background:#1b4286;
}

.titulo{
    color:#102b57;
    font-size:42px;
    font-weight:700;
    margin-bottom:10px;
}

.subtitulo{
    color:#666;
    margin-bottom:30px;
    font-size:18px;
}

.buscador{
    display:flex;
    gap:15px;
    margin-bottom:30px;
    flex-wrap:wrap;
}

input{
    width:500px;
    max-width:100%;
    padding:18px;
    border:1px solid #dcdcdc;
    border-radius:12px;
    font-size:18px;
}

button{
    padding:18px 30px;
    border:none;
    border-radius:12px;
    background:#102b57;
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#183f80;
}

.resultado{
    background:white;
    border-radius:25px;
    padding:35px;
    max-width:900px;
    box-shadow:0 10px 25px rgba(0,0,0,.08);
    border-left:10px solid #102b57;
}

.inicial{
    text-align:center;
    color:#888;
    font-size:18px;
}

.ok{
    color:#198754;
    margin-bottom:15px;
}

.error{
    color:#dc3545;
}

.dato{
    margin-bottom:20px;
}

.etiqueta{
    color:#102b57;
    font-weight:bold;
    margin-bottom:5px;
}

.valor{
    color:#333;
    font-size:20px;
}

</style>
</head>

<body>

dashboard.html
← Volver al Dashboard
</a>

<div class="titulo">
🔎 Buscar Serial
</div>

<div class="subtitulo">
Consulta de inventario en tiempo real
</div>

<div class="buscador">

<input
id="serial"
placeholder="Ingrese el serial"
onkeypress="if(event.key==='Enter'){buscar();}">

<button onclick="buscar()">
Buscar
</button>

</div>

<div id="resultado" class="resultado">

<div class="inicial">
📦 Ingrese un serial para iniciar la búsqueda
</div>

</div>

<script>

let inventario = [];

fetch("https://script.google.com/macros/s/AKfycbxhYkPMbOQJHrcSoxhFjOoo5zhspyW-yqdLVOsNmvhwQ7U-pxfgEjGAfqaAhP3Apa_qyw/exec")
.then(function(response){
    return response.json();
})
.then(function(data){
    inventario = data;
    console.log("Inventario cargado:", inventario.length);
})
.catch(function(error){
    console.error(error);
});

function buscar(){

    let valor = document
        .getElementById("serial")
        .value
        .trim()
        .toUpperCase();

    if(valor === ""){

        document.getElementById("resultado").innerHTML =
        '<h2 class="error">⚠️ Ingrese un serial</h2>';

        return;
    }

    let equipo = inventario.find(function(item){

        return String(item.serial)
        .toUpperCase() === valor;

    });

    if(equipo){

        document.getElementById("resultado").innerHTML =

        '<h2 class="ok">✅ Equipo encontrado</h2>' +

        '<hr style="margin:20px 0;">' +

        '<div class="dato">' +
        '<div class="etiqueta">🔢 Serial</div>' +
        '<div class="valor">' + equipo.serial + '</div>' +
        '</div>' +

        '<div class="dato">' +
        '<div class="etiqueta">📦 Material</div>' +
        '<div class="valor">' + equipo.material + '</div>' +
        '</div>' +

        '<div class="dato">' +
        '<div class="etiqueta">🏢 Marca</div>' +
        '<div class="valor">' + equipo.marca + '</div>' +
        '</div>' +

        '<div class="dato">' +
        '<div class="etiqueta">📍 Ubicación</div>' +
        '<div class="valor">' + equipo.ubicacion + '</div>' +
        '</div>';

    }else{

        document.getElementById("resultado").innerHTML =
        '<h2 class="error">❌ Serial no encontrado</h2>';

    }

}

</script>

</body>
</html>
