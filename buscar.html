<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buscar Serial</title>

<style>

body{
    font-family:Segoe UI,sans-serif;
    background:#f4f6f9;
    padding:40px;
}

h1{
    color:#102b57;
}

input{
    padding:15px;
    width:400px;
    font-size:18px;
}

button{
    padding:15px 25px;
    background:#102b57;
    color:white;
    border:none;
    cursor:pointer;
}

.resultado{
    margin-top:30px;
    background:white;
    padding:20px;
    border-radius:15px;
    box-shadow:0 0 10px rgba(0,0,0,.1);
}

</style>
</head>

<body>

<h1>🔎 Buscar Serial</h1>

<input id="serial" placeholder="Ingrese Serial">

<button onclick="buscar()">
Buscar
</button>

<div id="resultado" class="resultado">
Esperando búsqueda...
</div>

<script>

let inventario = [];

fetch("https://script.google.com/macros/s/AKfycbxhYkPMbOQJHrcSoxhFjOoo5zhspyW-yqdLVOsNmvhwQ7U-pxfgEjGAfqaAhP3Apa_qyw/exec")
.then(function(response){
    return response.json();
})
.then(function(data){
    inventario = data;
    console.log("Inventario cargado:", data.length);
})
.catch(function(error){
    console.log(error);
});

function buscar(){

    let valor =
        document.getElementById("serial")
        .value
        .trim()
        .toUpperCase();

    let equipo =
        inventario.find(function(item){
            return String(item.serial)
                .toUpperCase() === valor;
        });

    if(equipo){

        document.getElementById("resultado").innerHTML =
        "<h2>✅ Equipo encontrado</h2>" +
        "<p><b>Serial:</b> " + equipo.serial + "</p>" +
        "<p><b>Material:</b> " + equipo.material + "</p>" +
        "<p><b>Marca:</b> " + equipo.marca + "</p>" +
        "<p><b>Ubicación:</b> " + equipo.ubicacion + "</p>";

    }else{

        document.getElementById("resultado").innerHTML =
        "<h2>❌ Serial no encontrado</h2>";

    }

}

</script>

</body>
</html>
